name: news-monitor

on:
  # Расписание задаётся снаружи: cron-job.org дёргает workflow_dispatch пять раз в день.
  # Встроенный schedule убран — он срабатывал непредсказуемо (иногда 1 раз вместо 5)
  # и давал второй пост в тот же слот.
  workflow_dispatch:
    inputs:
      mode:
        description: "post - опубликовать пост, check - только проверить ленты"
        type: choice
        options: [post, check]
        default: post
      rubric:
        description: "Рубрика для ручного запуска (пусто = по времени)"
        type: choice
        options: ["", service, humor]
        default: ""

permissions:
  contents: write

concurrency:
  group: news-monitor
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - run: pip install -r requirements.txt

      - name: Run
        env:
          # Если у видео-монитора секреты называются иначе, поменяй имена после "secrets."
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GROQ_API_KEY_NEWS: ${{ secrets.GROQ_API_KEY_NEWS }}
          # Необязательно: прокси для t.me, если раннер его не видит (пустой = не используется)
          TG_PROXY: ${{ secrets.TG_PROXY }}
          RUBRIC: ${{ inputs.rubric }}
        run: |
          set -o pipefail
          if [ "${{ inputs.mode }}" = "check" ]; then
            python news_monitor.py --check 2>&1 | tee last_run.log
          else
            python news_monitor.py 2>&1 | tee last_run.log
          fi

      - name: Commit state
        # always(): лог нужен и у упавших запусков, иначе причину не увидеть
        if: ${{ always() }}
        continue-on-error: true
        run: |
          git config user.name "news-monitor-bot"
          git config user.email "news-monitor-bot@users.noreply.github.com"
          git add state.json last_run.log 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "news-monitor: update state"
            git pull --rebase
            git push
          fi
